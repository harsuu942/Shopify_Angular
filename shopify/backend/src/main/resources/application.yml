spring:
  application:
    name: hearth-shopify-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hearth_shopify?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-request-size: 20MB
      max-file-size: 20MB
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
server:
  port: 8080
  error:
    include-message: never
  compression:
    enabled: true
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health
    jmx:
      exposure:
        exclude: "*"
app:
  admin-api-url: ${ADMIN_API_URL:https://hearth-admin-backend.onrender.com}
  upload-dir: ${SHOP_UPLOAD_DIR:./data/product-images}
  catalogue-sync-secret: ${CATALOGUE_SYNC_SECRET:local-catalogue-sync-secret}
  cors-origin: ${CORS_ORIGIN:http://localhost:4200}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:300}
    auth-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:10}
  stripe:
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  jwt:
    secret: ${JWT_SECRET:local-development-storefront-signing-key-change-now-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  auth:
    customer-email: customer@example.com
    customer-password: Customer123!
    admin-email: admin@example.com
    admin-password: Admin123!
  mail:
    from: ${SMTP_FROM:}
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DDL_MODE:validate}
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  shutdown: graceful
app:
  catalogue-sync-secret: ${CATALOGUE_SYNC_SECRET}
  cors-origin: ${SHOPIFY_PUBLIC_URL}
  auth:
    customer-email: ${CUSTOMER_EMAIL}
    customer-password: ${CUSTOMER_PASSWORD}
    admin-email: ${SHOP_ADMIN_EMAIL}
    admin-password: ${SHOP_ADMIN_PASSWORD}
---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/hearth_shopify;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: root
    password: ''
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

