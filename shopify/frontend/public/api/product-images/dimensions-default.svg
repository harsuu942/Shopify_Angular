<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="100%" height="100%" style="background:#0b132b;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <!-- Technical Grid Background -->
  <defs>
    <pattern id="grid_dimensions-default_svg" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1c2d5a" stroke-width="0.75"/>
    </pattern>
    <pattern id="grid_major_dimensions-default_svg" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#2a3f7a" stroke-width="1.2"/>
    </pattern>
    <linearGradient id="panelGrad_dimensions-default_svg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="680" fill="#090e1f"/>
  <rect width="960" height="680" fill="url(#grid_dimensions-default_svg)"/>
  <rect width="960" height="680" fill="url(#grid_major_dimensions-default_svg)"/>

  <!-- Outer Blueprint Border -->
  <rect x="18" y="18" width="924" height="644" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
  <rect x="24" y="24" width="912" height="632" fill="none" stroke="#1e3a8a" stroke-width="1"/>

  <!-- TITLE HEADER BLOCK -->
  <g id="header">
    <rect x="36" y="34" width="888" height="52" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" rx="4"/>
    <text x="50" y="58" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="2">ULTRAHEAT® HEATING SYSTEMS · ENGINEERING CAD SPECIFICATION</text>
    <text x="50" y="76" fill="#ffffff" font-size="16" font-weight="800" letter-spacing="1">ULTRAHEAT RADIATOR — STANDARD COMPACT RADIATOR (DEPTH: 100mm)</text>
    <rect x="740" y="44" width="170" height="32" fill="#0284c7" rx="3"/>
    <text x="825" y="65" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">BS EN 442 VERIFIED</text>
  </g>

  <!-- FRONT ELEVATION VIEW -->
  <g id="front_elevation">
    <!-- View Title -->
    <rect x="46" y="105" width="220" height="26" fill="#1e293b" stroke="#64748b" stroke-width="0.8" rx="3"/>
    <text x="56" y="122" fill="#38bdf8" font-size="12" font-weight="700">1. FRONT ELEVATION VIEW</text>

    <!-- Radiator Body -->
    <rect x="70" y="150" width="460" height="240" fill="#1e293b" stroke="#e2e8f0" stroke-width="2" rx="3"/>
    <!-- Decorative top grille line -->
    <rect x="70" y="150" width="460" height="18" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <!-- Vertical Convector Flutes (Front Panel) -->
    <line x1="105" y1="172" x2="105" y2="385" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,2"/>
    <line x1="145" y1="172" x2="145" y2="385" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,2"/>
    <line x1="185" y1="172" x2="185" y2="385" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,2"/>
    <line x1="225" y1="172" x2="225" y2="385" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,2"/>
    <line x1="265" y1="172" x2="265" y2="385" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,2"/>
    <line x1="305" y1="172" x2="305" y2="385" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,2"/>
    <line x1="345" y1="172" x2="345" y2="385" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,2"/>
    <line x1="385" y1="172" x2="385" y2="385" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,2"/>
    <line x1="425" y1="172" x2="425" y2="385" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,2"/>
    <line x1="465" y1="172" x2="465" y2="385" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,2"/>
    <line x1="495" y1="172" x2="495" y2="385" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,2"/>

    <!-- Tappings (4 x 1/2" BSP) -->
    <!-- Top-Left (Air Vent Plug) -->
    <rect x="56" y="160" width="14" height="20" fill="#10b981" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="56" cy="170" r="5" fill="#ffffff"/>
    <text x="36" y="152" fill="#34d399" font-size="10" font-weight="700">1/2" AIR VENT</text>

    <!-- Top-Right (Blanking Plug) -->
    <rect x="530" y="160" width="14" height="20" fill="#64748b" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="544" cy="170" r="5" fill="#ffffff"/>
    <text x="500" y="152" fill="#cbd5e1" font-size="10" font-weight="700">1/2" BLANK PLUG</text>

    <!-- Bottom-Left (Flow / Valve Connection) -->
    <rect x="56" y="360" width="14" height="22" fill="#0284c7" stroke="#ffffff" stroke-width="1.2"/>
    <polygon points="46,371 36,365 36,377" fill="#0284c7"/>
    <text x="25" y="405" fill="#38bdf8" font-size="10" font-weight="800">FLOW / RETURN</text>
    <text x="25" y="417" fill="#94a3b8" font-size="9">1/2" BSP Female</text>

    <!-- Bottom-Right (Return / Valve Connection) -->
    <rect x="530" y="360" width="14" height="22" fill="#0284c7" stroke="#ffffff" stroke-width="1.2"/>
    <polygon points="554,371 564,365 564,377" fill="#0284c7"/>
    <text x="495" y="405" fill="#38bdf8" font-size="10" font-weight="800">RETURN / FLOW</text>
    <text x="495" y="417" fill="#94a3b8" font-size="9">1/2" BSP Female</text>

    <!-- Wall Brackets behind (Hidden/Mounting Position) -->
    <rect x="130" y="185" width="22" height="170" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="141" y="275" fill="#f59e0b" font-size="9" font-weight="700" text-anchor="middle">BRACKET</text>

    <rect x="445" y="185" width="22" height="170" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="456" y="275" fill="#f59e0b" font-size="9" font-weight="700" text-anchor="middle">BRACKET</text>

    <!-- DIMENSION ARROWS -->
    <!-- Length (L) Dimension Line (Top) -->
    <line x1="70" y1="135" x2="530" y2="135" stroke="#ef4444" stroke-width="1.8"/>
    <line x1="70" y1="125" x2="70" y2="145" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="530" y1="125" x2="530" y2="145" stroke="#ef4444" stroke-width="1.5"/>
    <polygon points="70,135 78,131 78,139" fill="#ef4444"/>
    <polygon points="530,135 522,131 522,139" fill="#ef4444"/>
    <rect x="220" y="122" width="160" height="24" fill="#0f172a" stroke="#ef4444" stroke-width="1" rx="3"/>
    <text x="300" y="138" fill="#fca5a5" font-size="11" font-weight="800" text-anchor="middle">LENGTH (L) = 400 - 2000 mm</text>

    <!-- Height (H) Dimension Line (Left) -->
    <line x1="45" y1="150" x2="45" y2="390" stroke="#ef4444" stroke-width="1.8"/>
    <line x1="37" y1="150" x2="53" y2="150" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="37" y1="390" x2="53" y2="390" stroke="#ef4444" stroke-width="1.5"/>
    <polygon points="45,150 41,158 49,158" fill="#ef4444"/>
    <polygon points="45,390 41,382 49,382" fill="#ef4444"/>
    <rect x="18" y="260" width="54" height="22" fill="#0f172a" stroke="#ef4444" stroke-width="1" rx="3"/>
    <text x="45" y="275" fill="#fca5a5" font-size="10" font-weight="800" text-anchor="middle">H mm</text>

    <!-- Pipe Centres Dimension (Bottom) -->
    <line x1="30" y1="435" x2="570" y2="435" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="5,3"/>
    <line x1="30" y1="425" x2="30" y2="445" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="570" y1="425" x2="570" y2="445" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="30,435 38,431 38,439" fill="#38bdf8"/>
    <polygon points="570,435 562,431 562,439" fill="#38bdf8"/>
    <rect x="190" y="423" width="220" height="22" fill="#0f172a" stroke="#38bdf8" stroke-width="1" rx="3"/>
    <text x="300" y="438" fill="#7dd3fc" font-size="10" font-weight="800" text-anchor="middle">PIPE CENTRES (VALVES) = L + 90 mm</text>
  </g>

  <!-- SIDE CROSS-SECTION / PROFILE VIEW -->
  <g id="side_profile">
    <rect x="610" y="105" width="280" height="26" fill="#1e293b" stroke="#64748b" stroke-width="0.8" rx="3"/>
    <text x="620" y="122" fill="#38bdf8" font-size="12" font-weight="700">2. SIDE SECTION &amp; WALL CLEARANCE</text>

    <!-- Wall Surface -->
    <rect x="850" y="145" width="16" height="270" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <!-- Wall Hatching -->
    <line x1="866" y1="160" x2="876" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="866" y1="190" x2="876" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="866" y1="220" x2="876" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="866" y1="250" x2="876" y2="240" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="866" y1="280" x2="876" y2="270" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="866" y1="310" x2="876" y2="300" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="866" y1="340" x2="876" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="866" y1="370" x2="876" y2="360" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="866" y1="400" x2="876" y2="390" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="890" y="270" fill="#94a3b8" font-size="11" font-weight="700" transform="rotate(90,890,270)" text-anchor="middle">SOLID WALL</text>

    <!-- Mounting Bracket Standoff -->
    <rect x="800" y="195" width="50" height="20" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>
    <rect x="800" y="335" width="50" height="20" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>
    <text x="825" y="210" fill="#000000" font-size="9" font-weight="800" text-anchor="middle">L-BRACKET</text>

    <!-- Side Profile Radiator Body -->
    <rect x="710" y="150" width="85" height="240" fill="url(#panelGrad_dimensions-default_svg)" stroke="#e2e8f0" stroke-width="2" rx="3"/>
    <!-- Top Grille on side -->
    <rect x="710" y="150" width="85" height="14" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>

    <!-- Internal Panel / Fin Details Description -->
    <text x="710" y="415" fill="#f8fafc" font-size="11" font-weight="700">DEPTH: 100 mm</text>
    <text x="710" y="430" fill="#94a3b8" font-size="9.5">Double panel convector construction</text>

    <!-- Depth Dimension Line -->
    <line x1="710" y1="135" x2="795" y2="135" stroke="#ef4444" stroke-width="1.6"/>
    <line x1="710" y1="128" x2="710" y2="142" stroke="#ef4444" stroke-width="1.2"/>
    <line x1="795" y1="128" x2="795" y2="142" stroke="#ef4444" stroke-width="1.2"/>
    <text x="752" y="130" fill="#fca5a5" font-size="10" font-weight="800" text-anchor="middle">D = 100mm</text>

    <!-- Wall to Pipe Centre Dimension -->
    <line x1="752" y1="395" x2="850" y2="395" stroke="#38bdf8" stroke-width="1.4"/>
    <line x1="752" y1="388" x2="752" y2="402" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="850" y1="388" x2="850" y2="402" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="785" y="410" fill="#7dd3fc" font-size="9" font-weight="700" text-anchor="middle">WALL TO PIPE: 65mm</text>
  </g>

  <!-- BOTTOM TECHNICAL SPECIFICATION TABLE BLOCK -->
  <g id="spec_table">
    <rect x="36" y="470" width="888" height="175" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" rx="4"/>
    
    <!-- Table Title Header -->
    <rect x="36" y="470" width="888" height="28" fill="#1e293b" rx="4"/>
    <text x="50" y="489" fill="#38bdf8" font-size="11.5" font-weight="800" letter-spacing="1">ENGINEERING DATA &amp; INSTALLATION SPECIFICATIONS</text>

    <!-- Column 1: Connection & Mount -->
    <text x="50" y="520" fill="#94a3b8" font-size="10" font-weight="700">TAPPINGS / CONNECTIONS</text>
    <text x="50" y="538" fill="#ffffff" font-size="12" font-weight="700">4 × 1/2" BSP (ISO 228)</text>
    <text x="50" y="555" fill="#94a3b8" font-size="10">Flow/Return reversible left or right</text>

    <text x="50" y="585" fill="#94a3b8" font-size="10" font-weight="700">WALL BRACKETS INCLUDED</text>
    <text x="50" y="603" fill="#ffffff" font-size="12" font-weight="700">Heavy Duty Galvanized L-Mounts</text>
    <text x="50" y="620" fill="#94a3b8" font-size="10">With sound-dampening nylon inserts</text>

    <!-- Column 2: Working Parameters -->
    <text x="310" y="520" fill="#94a3b8" font-size="10" font-weight="700">WORKING PRESSURE</text>
    <text x="310" y="538" fill="#38bdf8" font-size="12" font-weight="800">10 BAR (Tested to 13 Bar)</text>
    <text x="310" y="555" fill="#94a3b8" font-size="10">Suitable for closed and open systems</text>

    <text x="310" y="585" fill="#94a3b8" font-size="10" font-weight="700">MAX OPERATING TEMP</text>
    <text x="310" y="603" fill="#ffffff" font-size="12" font-weight="700">110 °C</text>
    <text x="310" y="620" fill="#94a3b8" font-size="10">Optimised for standard &amp; low-temp heat pumps</text>

    <!-- Column 3: Material & Finish -->
    <text x="570" y="520" fill="#94a3b8" font-size="10" font-weight="700">STEEL SPECIFICATION</text>
    <text x="570" y="538" fill="#ffffff" font-size="12" font-weight="700">1.20 mm Cold-Rolled Carbon Steel</text>
    <text x="570" y="555" fill="#94a3b8" font-size="10">Precision seam and spot resistance welded</text>

    <text x="570" y="585" fill="#94a3b8" font-size="10" font-weight="700">FINISH &amp; CORROSION RESISTANCE</text>
    <text x="570" y="603" fill="#ffffff" font-size="12" font-weight="700">RAL 9016 Traffic White</text>
    <text x="570" y="620" fill="#94a3b8" font-size="10">Electrophoretic primer + epoxy-polyester powder</text>

    <!-- Column 4: Compliance Badge & Warranty -->
    <rect x="760" y="510" width="145" height="115" fill="#1e293b" stroke="#38bdf8" stroke-width="1" rx="4"/>
    <text x="832" y="535" fill="#38bdf8" font-size="10" font-weight="800" text-anchor="middle">MANUFACTURER</text>
    <text x="832" y="558" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">10 YEARS</text>
    <text x="832" y="575" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">WARRANTY</text>
    <line x1="775" y1="585" x2="890" y2="585" stroke="#334155" stroke-width="1"/>
    <text x="832" y="602" fill="#cbd5e1" font-size="9" text-anchor="middle">CE / UKCA MARKED</text>
    <text x="832" y="616" fill="#10b981" font-size="9" font-weight="700" text-anchor="middle">EN 442 COMPLIANT</text>
  </g>
</svg>