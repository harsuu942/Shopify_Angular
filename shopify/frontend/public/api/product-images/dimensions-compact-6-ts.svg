<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="100%" height="100%" style="background:#0b132b;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <pattern id="grid_dimensions-compact-6-ts_svg" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1c2d5a" stroke-width="0.75"/>
    </pattern>
    <pattern id="grid_major_dimensions-compact-6-ts_svg" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#2a3f7a" stroke-width="1.2"/>
    </pattern>
    <linearGradient id="panelGrad_dimensions-compact-6-ts_svg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="960" height="680" fill="#090e1f"/>
  <rect width="960" height="680" fill="url(#grid_dimensions-compact-6-ts_svg)"/>
  <rect width="960" height="680" fill="url(#grid_major_dimensions-compact-6-ts_svg)"/>

  <rect x="18" y="18" width="924" height="644" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
  <rect x="24" y="24" width="912" height="632" fill="none" stroke="#1e3a8a" stroke-width="1"/>

  <!-- HEADER -->
  <g id="header">
    <rect x="36" y="34" width="888" height="52" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" rx="4"/>
    <text x="50" y="58" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="2">ULTRAHEAT® COMPACT 6 MULTI-PORT · TECHNICAL BLUEPRINT</text>
    <text x="50" y="76" fill="#ffffff" font-size="16" font-weight="800" letter-spacing="1">COMPACT 6 TS — TYPE 33 TRIPLE CONVECTOR (DEPTH: 160mm, 6 PORTS)</text>
    <rect x="740" y="44" width="170" height="32" fill="#0284c7" rx="3"/>
    <text x="825" y="65" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">6-TAPPING VERSATILE</text>
  </g>

  <!-- FRONT ELEVATION VIEW WITH 6 TAPPINGS -->
  <g id="front_elevation">
    <rect x="46" y="105" width="260" height="26" fill="#1e293b" stroke="#64748b" stroke-width="0.8" rx="3"/>
    <text x="56" y="122" fill="#38bdf8" font-size="12" font-weight="700">1. FRONT ELEVATION &amp; 6-TAPPINGS</text>

    <!-- Radiator Body -->
    <rect x="70" y="150" width="460" height="235" fill="#1e293b" stroke="#e2e8f0" stroke-width="2" rx="3"/>
    <rect x="70" y="150" width="460" height="18" fill="#334155" stroke="#94a3b8" stroke-width="1"/>

    <!-- Flutes -->
    <line x1="110" y1="172" x2="110" y2="380" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,2"/>
    <line x1="160" y1="172" x2="160" y2="380" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,2"/>
    <line x1="210" y1="172" x2="210" y2="380" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,2"/>
    <line x1="260" y1="172" x2="260" y2="380" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,2"/>
    <line x1="310" y1="172" x2="310" y2="380" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,2"/>
    <line x1="360" y1="172" x2="360" y2="380" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,2"/>
    <line x1="410" y1="172" x2="410" y2="380" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,2"/>
    <line x1="460" y1="172" x2="460" y2="380" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,2"/>

    <!-- Side Ports (4 Ports) -->
    <!-- Top-Left Air Vent -->
    <rect x="56" y="160" width="14" height="20" fill="#10b981" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="56" cy="170" r="5" fill="#ffffff"/>
    <text x="36" y="152" fill="#34d399" font-size="10" font-weight="700">PORT 1 (VENT)</text>

    <!-- Top-Right Blank or Built-in Valve Head Insert -->
    <rect x="530" y="160" width="14" height="20" fill="#f59e0b" stroke="#ffffff" stroke-width="1.2"/>
    <circle cx="544" cy="170" r="5" fill="#ffffff"/>
    <text x="480" y="152" fill="#fbbf24" font-size="10" font-weight="700">PORT 2 (VALVE INSERT)</text>

    <!-- Bottom Side Tappings (Ports 3 & 4) -->
    <rect x="56" y="355" width="14" height="22" fill="#0284c7" stroke="#ffffff" stroke-width="1.2"/>
    <text x="25" y="398" fill="#38bdf8" font-size="9" font-weight="700">PORT 3 (SIDE L)</text>

    <rect x="530" y="355" width="14" height="22" fill="#0284c7" stroke="#ffffff" stroke-width="1.2"/>
    <text x="500" y="398" fill="#38bdf8" font-size="9" font-weight="700">PORT 4 (SIDE R)</text>

    <!-- BOTTOM UNDERSIDE PORTS (Ports 5 & 6) - COMPACT 6 SIGNATURE FEATURE -->
    <g id="underside_ports">
      <!-- Underside Pipe Outlets (50mm centres, Right side) -->
      <rect x="475" y="385" width="16" height="22" fill="#ef4444" stroke="#ffffff" stroke-width="1.2"/>
      <rect x="505" y="385" width="16" height="22" fill="#0284c7" stroke="#ffffff" stroke-width="1.2"/>
      <!-- Arrows pointing up into bottom ports -->
      <polygon points="483,418 479,425 487,425" fill="#ef4444"/>
      <polygon points="513,418 509,425 517,425" fill="#0284c7"/>

      <!-- 50mm Centre Callout Callout -->
      <line x1="483" y1="428" x2="513" y2="428" stroke="#f59e0b" stroke-width="1.5"/>
      <line x1="483" y1="424" x2="483" y2="432" stroke="#f59e0b" stroke-width="1.2"/>
      <line x1="513" y1="424" x2="513" y2="432" stroke="#f59e0b" stroke-width="1.2"/>
      <rect x="460" y="433" width="76" height="18" fill="#0f172a" stroke="#f59e0b" stroke-width="1" rx="2"/>
      <text x="498" y="446" fill="#fcd34d" font-size="9.5" font-weight="800" text-anchor="middle">50mm c/c</text>
      <text x="498" y="462" fill="#38bdf8" font-size="8.5" font-weight="700" text-anchor="middle">PORTS 5 &amp; 6 (H-BLOCK)</text>
    </g>

    <!-- Length & Height Callouts -->
    <line x1="70" y1="135" x2="530" y2="135" stroke="#ef4444" stroke-width="1.8"/>
    <line x1="70" y1="125" x2="70" y2="145" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="530" y1="125" x2="530" y2="145" stroke="#ef4444" stroke-width="1.5"/>
    <polygon points="70,135 78,131 78,139" fill="#ef4444"/>
    <polygon points="530,135 522,131 522,139" fill="#ef4444"/>
    <rect x="230" y="122" width="140" height="24" fill="#0f172a" stroke="#ef4444" stroke-width="1" rx="3"/>
    <text x="300" y="138" fill="#fca5a5" font-size="11" font-weight="800" text-anchor="middle">LENGTH L = 400 - 2000 mm</text>

    <line x1="45" y1="150" x2="45" y2="385" stroke="#ef4444" stroke-width="1.8"/>
    <polygon points="45,150 41,158 49,158" fill="#ef4444"/>
    <polygon points="45,385 41,377 49,377" fill="#ef4444"/>
    <rect x="18" y="255" width="54" height="22" fill="#0f172a" stroke="#ef4444" stroke-width="1" rx="3"/>
    <text x="45" y="270" fill="#fca5a5" font-size="10" font-weight="800" text-anchor="middle">H mm</text>
  </g>

  <!-- SIDE PROFILE VIEW -->
  <g id="side_profile">
    <rect x="610" y="105" width="280" height="26" fill="#1e293b" stroke="#64748b" stroke-width="0.8" rx="3"/>
    <text x="620" y="122" fill="#38bdf8" font-size="12" font-weight="700">2. CROSS SECTION &amp; MULTI-PANEL</text>

    <!-- Wall Surface -->
    <rect x="850" y="145" width="16" height="270" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <line x1="866" y1="180" x2="876" y2="170" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="866" y1="230" x2="876" y2="220" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="866" y1="280" x2="876" y2="270" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="866" y1="330" x2="876" y2="320" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="866" y1="380" x2="876" y2="370" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="890" y="270" fill="#94a3b8" font-size="11" font-weight="700" transform="rotate(90,890,270)" text-anchor="middle">SOLID WALL</text>

    <!-- Brackets -->
    <rect x="790" y="195" width="60" height="20" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>
    <rect x="790" y="335" width="60" height="20" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>

    <!-- Radiator Body Side Section -->
    <rect x="660" y="150" width="112" height="235" fill="url(#panelGrad_dimensions-compact-6-ts_svg)" stroke="#e2e8f0" stroke-width="2" rx="3"/>
    <rect x="660" y="150" width="112" height="14" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>

    <text x="660" y="415" fill="#f8fafc" font-size="11" font-weight="700">DEPTH: 160 mm</text>
    <text x="660" y="430" fill="#94a3b8" font-size="9.5">3 Panels + 3 Fins · High Thermal Heat Output</text>

    <line x1="660" y1="135" x2="772" y2="135" stroke="#ef4444" stroke-width="1.6"/>
    <text x="716" y="130" fill="#fca5a5" font-size="10" font-weight="800" text-anchor="middle">D = 160mm</text>
  </g>

  <!-- SPECIFICATION TABLE -->
  <g id="spec_table">
    <rect x="36" y="475" width="888" height="170" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" rx="4"/>
    <rect x="36" y="475" width="888" height="28" fill="#1e293b" rx="4"/>
    <text x="50" y="494" fill="#38bdf8" font-size="11.5" font-weight="800" letter-spacing="1">COMPACT 6 TECHNICAL SPECIFICATION &amp; CONNECTION FLEXIBILITY</text>

    <text x="50" y="525" fill="#94a3b8" font-size="10" font-weight="700">VERSATILE 6-PORT DESIGN</text>
    <text x="50" y="543" fill="#ffffff" font-size="12" font-weight="700">4 × 1/2" Side + 2 × 3/4" Bottom</text>
    <text x="50" y="560" fill="#94a3b8" font-size="10">Built-in thermostatic valve insert option</text>

    <text x="50" y="590" fill="#94a3b8" font-size="10" font-weight="700">UNDERSIDE CONNECTION CENTRES</text>
    <text x="50" y="608" fill="#38bdf8" font-size="12" font-weight="800">50 mm Standard H-Block</text>
    <text x="50" y="625" fill="#94a3b8" font-size="10">Allows pipework hidden straight out of wall/floor</text>

    <text x="330" y="525" fill="#94a3b8" font-size="10" font-weight="700">MAX WORKING PRESSURE</text>
    <text x="330" y="543" fill="#38bdf8" font-size="12" font-weight="800">10 BAR (Test Pressure: 13 Bar)</text>
    <text x="330" y="560" fill="#94a3b8" font-size="10">High structural pressure threshold</text>

    <text x="330" y="590" fill="#94a3b8" font-size="10" font-weight="700">MANUFACTURING MATERIAL</text>
    <text x="330" y="608" fill="#ffffff" font-size="12" font-weight="700">1.20 mm Cold-Rolled Steel</text>
    <text x="330" y="625" fill="#94a3b8" font-size="10">Pre-treated, anti-corrosion phosphate coating</text>

    <text x="600" y="525" fill="#94a3b8" font-size="10" font-weight="700">POWDER COATING FINISH</text>
    <text x="600" y="543" fill="#ffffff" font-size="12" font-weight="700">RAL 9016 Traffic White</text>
    <text x="600" y="560" fill="#94a3b8" font-size="10">Scratch-resistant &amp; easy to clean</text>

    <text x="600" y="590" fill="#94a3b8" font-size="10" font-weight="700">THERMAL EFFICIENCY</text>
    <text x="600" y="608" fill="#ffffff" font-size="12" font-weight="700">BS EN 442 Standardized Output</text>
    <text x="600" y="625" fill="#94a3b8" font-size="10">Certified ΔT50°C and ΔT30°C output charts</text>

    <rect x="790" y="515" width="120" height="115" fill="#1e293b" stroke="#38bdf8" stroke-width="1" rx="4"/>
    <text x="850" y="540" fill="#38bdf8" font-size="9.5" font-weight="800" text-anchor="middle">PEACE OF MIND</text>
    <text x="850" y="565" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">10 YEAR</text>
    <text x="850" y="582" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">WARRANTY</text>
    <line x1="805" y1="592" x2="895" y2="592" stroke="#334155" stroke-width="1"/>
    <text x="850" y="612" fill="#10b981" font-size="9" font-weight="700" text-anchor="middle">ULTRAHEAT OEM</text>
  </g>
</svg>