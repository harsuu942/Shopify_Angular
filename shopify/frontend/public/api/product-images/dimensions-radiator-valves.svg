<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="100%" height="100%" style="background:#0b132b;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <pattern id="grid_valves" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1c2d5a" stroke-width="0.75"/>
    </pattern>
  </defs>

  <rect width="960" height="680" fill="#090e1f"/>
  <rect width="960" height="680" fill="url(#grid_valves)"/>
  <rect x="18" y="18" width="924" height="644" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>

  <!-- HEADER -->
  <g id="header">
    <rect x="36" y="34" width="888" height="52" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" rx="4"/>
    <text x="50" y="58" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="2">ULTRAHEAT® VALVES &amp; ACCESSORIES · SCHEMATIC SPECIFICATION</text>
    <text x="50" y="76" fill="#ffffff" font-size="16" font-weight="800" letter-spacing="1">ANGLED TRV THERMOSTATIC RADIATOR VALVE &amp; LOCKSHIELD SET</text>
    <rect x="740" y="44" width="170" height="32" fill="#0284c7" rx="3"/>
    <text x="825" y="65" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">15mm × 1/2" BSP</text>
  </g>

  <!-- VALVE SCHEMATIC DRAWING -->
  <g id="valve_drawing">
    <rect x="46" y="105" width="280" height="26" fill="#1e293b" stroke="#64748b" stroke-width="0.8" rx="3"/>
    <text x="56" y="122" fill="#38bdf8" font-size="12" font-weight="700">1. THERMOSTATIC VALVE PROFILE</text>

    <!-- TRV Head (Top) -->
    <rect x="160" y="150" width="80" height="110" fill="#e2e8f0" stroke="#0f172a" stroke-width="2" rx="6"/>
    <!-- Head ribs -->
    <line x1="160" y1="175" x2="240" y2="175" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="195" x2="240" y2="195" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="215" x2="240" y2="215" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="160" y1="235" x2="240" y2="235" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="200" y="200" fill="#0f172a" font-size="14" font-weight="900" text-anchor="middle">5 · · 3 · · 1</text>
    <text x="200" y="250" fill="#0284c7" font-size="10" font-weight="800" text-anchor="middle">❄ FROST PROTECT</text>

    <!-- Brass Valve Body (Forged Angled) -->
    <rect x="175" y="260" width="50" height="90" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="225" y="285" width="70" height="40" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Radiator Tail Union (1/2" Male BSP) -->
    <rect x="295" y="290" width="35" height="30" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
    <text x="345" y="310" fill="#38bdf8" font-size="11" font-weight="800">1/2" BSP MALE</text>
    <text x="345" y="325" fill="#94a3b8" font-size="9.5">Connects to Radiator Tapping</text>

    <!-- Copper Pipe Compression Nut (15mm) -->
    <rect x="170" y="350" width="60" height="28" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="200" y1="378" x2="200" y2="440" stroke="#f97316" stroke-width="15"/>
    <text x="200" y="460" fill="#fdba74" font-size="11" font-weight="800" text-anchor="middle">15 mm COPPER PIPE</text>

    <!-- Dimensions -->
    <line x1="140" y1="150" x2="140" y2="360" stroke="#ef4444" stroke-width="1.5"/>
    <polygon points="140,150 136,158 144,158" fill="#ef4444"/>
    <polygon points="140,360 136,352 144,352" fill="#ef4444"/>
    <text x="125" y="260" fill="#fca5a5" font-size="10" font-weight="800" text-anchor="middle" transform="rotate(-90,125,260)">HEIGHT: 120 mm</text>

    <line x1="200" y1="410" x2="330" y2="410" stroke="#ef4444" stroke-width="1.5"/>
    <polygon points="200,410 208,406 208,414" fill="#ef4444"/>
    <polygon points="330,410 322,406 322,414" fill="#ef4444"/>
    <text x="265" y="428" fill="#fca5a5" font-size="10" font-weight="800" text-anchor="middle">CENTRE PROJECTION: 82 mm</text>
  </g>

  <!-- LOCKSHIELD PROFILE -->
  <g id="lockshield_drawing">
    <rect x="520" y="105" width="280" height="26" fill="#1e293b" stroke="#64748b" stroke-width="0.8" rx="3"/>
    <text x="530" y="122" fill="#38bdf8" font-size="12" font-weight="700">2. MATCHING LOCKSHIELD VALVE</text>

    <rect x="630" y="210" width="50" height="50" fill="#e2e8f0" stroke="#0f172a" stroke-width="2" rx="4"/>
    <text x="655" y="238" fill="#0f172a" font-size="10" font-weight="800" text-anchor="middle">BALANCING</text>
    <text x="655" y="250" fill="#0f172a" font-size="9" text-anchor="middle">CAP</text>

    <rect x="630" y="260" width="50" height="90" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="680" y="285" width="70" height="40" fill="#d97706" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="750" y="290" width="35" height="30" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="625" y="350" width="60" height="28" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="655" y1="378" x2="655" y2="440" stroke="#f97316" stroke-width="15"/>
    <text x="655" y="460" fill="#fdba74" font-size="11" font-weight="800" text-anchor="middle">15 mm COPPER PIPE</text>
  </g>

  <!-- SPEC TABLE -->
  <g id="spec_table">
    <rect x="36" y="495" width="888" height="150" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" rx="4"/>
    <rect x="36" y="495" width="888" height="26" fill="#1e293b" rx="4"/>
    <text x="50" y="513" fill="#38bdf8" font-size="11" font-weight="800">VALVE SPECIFICATIONS &amp; TEMPERATURE PROFILE</text>

    <text x="50" y="540" fill="#94a3b8" font-size="10">TEMPERATURE RANGE:</text>
    <text x="50" y="557" fill="#ffffff" font-size="12" font-weight="700">7 °C (Frost ❄) to 28 °C (Position 5)</text>

    <text x="50" y="590" fill="#94a3b8" font-size="10">MAX OPERATING PRESSURE:</text>
    <text x="50" y="607" fill="#38bdf8" font-size="12" font-weight="800">10 BAR (Max Differential: 1.0 Bar)</text>

    <text x="350" y="540" fill="#94a3b8" font-size="10">CONSTRUCTION MATERIAL:</text>
    <text x="350" y="557" fill="#ffffff" font-size="12" font-weight="700">Heavy DZR Forged Brass with EPDM seals</text>

    <text x="350" y="590" fill="#94a3b8" font-size="10">CONNECTIONS:</text>
    <text x="350" y="607" fill="#ffffff" font-size="12" font-weight="700">1/2" Male BSP Thread × 15mm Compression</text>

    <text x="650" y="540" fill="#94a3b8" font-size="10">COMPLIANCE:</text>
    <text x="650" y="557" fill="#ffffff" font-size="12" font-weight="700">BS EN 215 Certified · Class A Efficiency</text>

    <text x="650" y="590" fill="#94a3b8" font-size="10">WARRANTY:</text>
    <text x="650" y="607" fill="#ffffff" font-size="12" font-weight="700">5-Year Manufacturer Warranty</text>
  </g>
</svg>