services:
  - type: web
    name: the-heating-and-plumbing-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_ROLE
        value: unified
      - key: SHOPIFY_API_URL
        value: http://127.0.0.1:8080
      - key: ADMIN_API_URL
        value: http://127.0.0.1:8081
      - key: CATALOGUE_SYNC_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_NAME
        value: Production Admin
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        value: https://theheatingandplumbing.harsh942-mi.workers.dev,https://theheatingandplumbing-admin.harsh942-mi.workers.dev
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
    disk:
      name: thp-production-data
      mountPath: /app/data
      sizeGB: 5
