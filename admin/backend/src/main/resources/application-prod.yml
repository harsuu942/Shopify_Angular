spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: ${DDL_MODE:validate}
    properties:
      hibernate:
        format_sql: false
server:
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework
  shutdown: graceful
app:
  upload-dir: ${ADMIN_UPLOAD_DIR:/var/lib/hearth-admin/product-images}
  catalogue-sync-secret: ${CATALOGUE_SYNC_SECRET}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  cors-origin: ${ADMIN_PUBLIC_URL}
spring.lifecycle.timeout-per-shutdown-phase: 30s
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
