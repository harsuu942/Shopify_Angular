server {
  listen 80;
  server_name shop.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name shop.example.com;
  server_tokens off;
  client_max_body_size 1m;
  ssl_certificate /etc/letsencrypt/live/shop.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;
  root /var/www/hearth/shopify;
  index index.html;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    limit_req zone=hearth_api burst=30 nodelay;
    limit_conn hearth_connections 20;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico)$ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
}

server {
  listen 80;
  server_name admin.example.com;
  return 301 https://$host$request_uri;
}

